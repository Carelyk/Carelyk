name: Generate enchanted contribution game

on:
  # Kept manual to respect the profile's existing no-scheduled-commits setup.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

concurrency:
  group: contribution-game
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Galaga contribution graphs
        uses: abozanona/pacman-contribution-graph@d258e3fb01511c1ff4fe6418408ede37b2ad4935 # v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: galaga
          hide_month_labels: "false"

      - name: Publish graphs to the output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: galaga-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
